<!doctype html><html lang="en"><head><title>Blot — Legal</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f2ede1;--ink:#17140f;--muted:#7a7263;--accent:#c2402a;--link:#2f6b4a;--card:#fbf8f0;--line:#d8d0bd}
@media (prefers-color-scheme:dark){:root{--bg:#17140f;--ink:#f2ede1;--muted:#8a8271;--accent:#d96a52;--link:#6f9c82;--card:#211d15;--line:#3a3527}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

header{border-bottom:2px solid var(--ink);padding-bottom:20px;margin-bottom:32px}

.sub{color:var(--muted);font-size:14px;margin:0}
a{color:var(--link)}
ul{padding-left:20px}
li{margin:6px 0}
.note{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);padding:14px 16px;border-radius:0;margin:18px 0}
footer{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
</style>
